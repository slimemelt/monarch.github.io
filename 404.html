<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Monarch</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<style>html,body{height:100%;margin:0;background:#f9b10f}</style>
</head>
<body>
<script type="module">
  // GitHub Pages serves this file for any path that doesn't exist. A path saved as a short link
  // in the admin is forwarded; anything else goes to the homepage.
  const API = "https://api.bloomnetworks.net";

  const host = location.hostname.replace(/^www\./, "");
  const path = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "").toLowerCase();

  async function findDestination() {
    const response = await fetch(`${API}/redirects`);
    if (!response.ok) throw new Error(`redirects failed (${response.status})`);
    const { redirects } = await response.json();
    return redirects.find((row) => row.host === host && row.path === path)?.url;
  }

  try {
    location.replace((await findDestination()) || "/");
  } catch {
    location.replace("/");
  }
</script>
</body>
</html>
